[project]
name = "lottery-bot"
version = "0.1.0"
description = "Personal Powerball / Mega Millions toolkit: randomness audit, split-avoiding picks, and a hard budget ledger. It does not predict numbers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
lottery-bot = "lottery_bot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lottery_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
